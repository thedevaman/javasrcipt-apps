<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class=" bg-rose-500 h-screen">
        <div class="bg-white p-12 w-6/12 mx-auto">
            <h1 class="text-4xl font-bold">Local Storage</h1>
            <form class="flex flex-col gap-6 mt-8" onsubmit="store(event)"> 
                <input id="key" class="border border-gray-300 p-3 roounded" placeholder="key"/>
                <input id="value" class="border border-gray-300 p-3 roounded" placeholder="value"/>
                <button class="bg-violet-500 hover:bg-violet-600 p-3 rounded text-white">Store</button>
            </form>
        </div>
    </div>
   <script src="script.js"></script>
</body>
</html>
