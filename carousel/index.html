<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link
    href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    rel="stylesheet"
   />

   <style>
    #slider{
        transition: 1s;
    }
   </style>
</head>
<body>
    <div class="w-[940px] overflow-hidden mx-auto relative">
        <div class="w-[3760px] flex" id="slider">
            <img src="images/1.jpg" alt="" class="w-[940px] height-[480px]">
            <img src="images/2.jpg" alt="" class="w-[940px] height-[480px]">
            <img src="images/3.jpg" alt="" class="w-[940px] height-[480px]">
            <img src="images/4.jpg" alt="" class="w-[940px] height-[480px]">
        </div>
        <button onclick="prev()" class="bg-white b-white shadow-lg text-3xl py-3 absolute top-1/2 transform -translate-y-1/2 left-0">
            <i class="ri-arrow-left-s-line"></i>     
        </button>
         <button onclick="next()" class="bg-white b-white shadow-lg text-3xl py-3 absolute top-1/2 transform -translate-y-1/2 right-0">
            <i class="ri-arrow-right-s-line"></i>     
        </button>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
