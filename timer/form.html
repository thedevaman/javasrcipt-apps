<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Document</title>
</head>
<body class="bg-gray-100">
    <div class="h-screen flex items-center justify-center">
       <form class="flex flex-col gap-4" onsubmit="login(event)">
        <input id="email" type="email" class="w-[350px] border border-gray-300 p-3 rounded" placeholder="Email id" required/>
        <input id="password" type="password" class="w-[350px] border border-gray-300 p-3 rounded" placeholder="Password" required/>
        <button class="bg-violet-500 p-3 rounded font-medium text-white hover:bg-violet-700 hover:cursor-pointer">Sign In</button>
       </form>
    </div>

    <script src="script/script.js"></script>
</body>
</html>
