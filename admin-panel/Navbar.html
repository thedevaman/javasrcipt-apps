<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link
    href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    rel="stylesheet"
   />
</head>
<body>
    <nav class="shadow-lg flex justify-between lg:px-16 pl-4">
        <img src="images/logo.png" class="w-[150px]" />
        <div class="lg:flex hidden gap-4">
            <a href="#" class="px-10 py-4 hover:bg-gray-200 flex items-center font-medium ">Home</a>
            <a href="#" class="px-10 py-4 hover:bg-gray-200 flex items-center font-medium ">Courses</a>
            <a href="#" class="px-10 py-4 hover:bg-gray-200 flex items-center font-medium ">Tutorial</a>
            <a href="#" class="px-10 py-4 hover:bg-gray-200 flex items-center font-medium ">Login</a>
            <a href="#" class="px-10 py-4 bg-rose-500 text-white hover:bg-rose-600 flex items-center font-medium ">Register</a>
        </div>
        <button onclick="openMobileMenu()" class="lg:hidden block bg-rose-500 text-white px-6 text-2xl">
             <i class="ri-menu-3-line"></i>
        </button>
        <aside id="aside" style="right: -280px; transition: 0.3s;" class="lg:hidden fixed top-0 h-full w-[280px] bg-gray-100 z-[200000]">
            <div class="flex justify-between items-center p-4">
                 <img src="images/logo.png" class="w-[150px]" />
                 <i class="ri-close-line font-bold" onclick="closeMobileMenu()"></i>
            </div>
            <a href="#" class="px-10 py-4 hover:bg-gray-200 flex items-center font-medium ">Home</a>
            <a href="#" class="px-10 py-4 hover:bg-gray-200 flex items-center font-medium ">Courses</a>
            <a href="#" class="px-10 py-4 hover:bg-gray-200 flex items-center font-medium ">Tutorial</a>
            <a href="#" class="px-10 py-4 hover:bg-gray-200 flex items-center font-medium ">Login</a>
            <a href="#" class="px-10 py-4 bg-blue-500 text-white hover:bg-blue-600 flex items-center font-medium ">Register</a>
        </aside>
    </nav>
    
    
    <script src="script/navbar.js"></script>
</body>
</html>
