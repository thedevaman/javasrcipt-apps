<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const changeColour = (input)=>{
       const title = document.getElementById('title')
       title.style.color = input.value
        }
    </script>
    <style>
        body{
            background: #f5f5f5;;
        }
        #card{
            width: 150px;
            height: 150px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 8px 16px 0px rgba(0,0,0,0.2);
        }
        #page{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #color-input{
            width: 100%;
            height: 100%;
        }
        #title{
            font-size: 60px;
            font-family:sans-serif
        }
    </style>
   
</head>
<body>
   <div id="page">
    <h1 id="title">Data</h1>
       <div id = "card">
        <input type="color" onchange="changeColour(this)" id="color-input"/>
       </div>
   </div>
</body>
</html>
