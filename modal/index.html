<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
   <link
    href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    rel="stylesheet"
   />
</head>
<body>
    <div class="p-12">
      <button onclick="openModal()" class="bg-indigo-500 px-8 py-3 rounded text-white font-medium hover:bg-indigo-600">Toggle</button>
    </div>
    <div id="modal" class="hidden fixed top-0 left-0 h-full bg-black/75 w-full flex items-center justify-center animate__animated animate__fadeIn">
       <div class="bg-white rounded-lg p-8 w-[500px] animate__animated animate__zoomIn">
        <div class="flex justify-between items-center mb-3 border-b border-b-gray-200 pb-3">
            <h1 class="text-xl font-medium">Modal</h1>
            <i class="ri-close-circle-fill text-gray-500 hover:text-gray-800" onclick="closeModal()"></i>
        </div>
         <p class="text-gray-500">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci provident necessitatibus, suscipit placeat voluptas, cum quas, eligendi rerum quaerat voluptatum reprehenderit debitis exercitationem maxime qui quod! Beatae error est saepe!
         </p>

         <div class="flex justify-end gap-3 mt-6">
          <button class="bg-blue-800 hover:bg-indigo-600 px-6 py-2 rounded text-white">OK</button>
          <button class="bg-white hover:bg-gray-200 hover:border-none px-5 py-2 text-black font-medium rounded border border-gray-200" onclick="closeModal()">Cancel</button>
         </div>
       </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
