<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const preview = (e) =>{
           const selectedsrc = e.src
           document.getElementById('result').src = selectedsrc
        }
    </script>
    <style>
        body{
            background: #ddd;
        }
        #page {
          width: 50%;
          margin: 0 auto;
        }
        #result {
            width: 100%;
            border: 3px solid white;
        }
        #thumb-box{
            display: flex;
            width: 100%;
            gap:16px;
            margin-top:16px;
           
        }
        #thumb-box img{
            width: 32%;
            border: 1px solid white;
        }
        #title{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 40px;
        }
        #thumb-box img:hover{
        transform: scale(1.2);
        transition: 0.3s;
        }
    </style>
</head>
<body>
 
    <div id="page">
        <h1 id="title">Gallery App</h1>
        <img src="images/image1.jpeg" alt="" id="result">
        <div id="thumb-box">
            <img src="images/image2.jpeg" alt="" onclick="preview(this)">
            <img src="images/image3.jpeg" alt="" onclick="preview(this)">
            <img src="images/image4.jpeg" alt="" onclick="preview(this)">
        </div>
    </div>
    
</body>
</html>
