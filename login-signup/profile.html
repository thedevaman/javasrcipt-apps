<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"
    />
    <title>Document</title>
</head>
<body>

    <div class="min-h-screen bg-gray-200 py-32">
    <div class="w-10/12 mx-auto flex gap-8">
      <div class="bg-white p-12 rounded-2xl w-[300px] relative">
        <img src="images/avatar.svg" alt="profile-img" class="w-48 h-48 absolute -top-16 left-12 rounded-full bg-white ">
        <div class="mt-20 text-center">
            <h1 class="text-xl font-medium">Aman</h1>
            <p class="text-gray-600">aman@gmail.com</p>
             <button class="relative w-full bg-red-500 text-white font-medium py-2 px-6 rounded hover:bg-red-600 mt-6">
                <i class="ri-upload-line"></i>
                Choose Image
                <input onchange="uploadImage()" id="file-input" type="file" accept="images/*" class="opacity-0 w-full h-full absolute top-0 left-0"/>
            </button>
             <button class="w-full bg-green-500 text-white font-medium py-2 px-6 rounded hover:bg-green-600 mt-6">
                <i class="ri-arrow-down-line"></i>
                Download
            </button>
            <button onclick="logout()" class="w-full bg-blue-500 text-white font-medium py-2 px-6 rounded hover:bg-blue-600 mt-6">
                <i class="ri-logout-circle-r-line"></i>
                Logout
            </button>
            
        </div>
      </div>
      <div class="bg-white rounded-2xl p-12 flex-1">
       <img id="picture" src="images/nature.webp"/>
      </div>
    </div>    
    </div>
    <script src="js/profile.js"></script>
</body>
</html>
