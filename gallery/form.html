<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        const changeColour = (input)=>{
       const title = document.getElementById('title')
       title.style.color = input.value
        }
    </script>
    <style>
        body{
            background: #ddd;;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        
        #page{
            height:500px;
            width: 70%;
            display: flex;
            background: white;
            margin: 48px auto;
            border-radius: 8px;
            display: flex;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
        }

        #form-box,#card
        {
            width: 50%;
            padding: 24px;
        }
        #title{
            font-family: sans-serif;
        }
        form{
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        input{
            border: 1px solid #ccc;
            padding: 16px 34px;
            border-radius: 4px;
        }
        #create-button
        {
            background-color: crimson;
            color: white;
            padding: 16px;
            width: fit-content;
            border: none;
            border-radius: 4px;
            font-size: 18px;

        }

        #card{
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #card h1, #card p{
            font-family: sans-serif;
        }

        #person-mail {
            padding: 0px;
            margin: 0px;
        }
       
    </style>
   
</head>
<body>
   <div id="page">
       <div id="form-box">
        <h1 id="title">ID maker</h1>
        <form>
            <input placeholder="fullname" />
            <input placeholder="E-mail" />
            <input placeholder="Role" />
            <button id="create-button">Create</button>
        </form>
       </div>
       <div id="card">
        <img id="pic" src="https://tse1.mm.bing.net/th/id/OIP.b5DScOSff8sk1Q98E4Rc5QHaHa?pid=Api&h=220&P=0" width="150" alt="">
       <h1 id="person-name">Aman</h1>
       <p id="person-mail">aman@gmail.com</p>
       <p id="person-role">Developer</p>
    </div>
   </div>
</body>
</html>
